name: auth-web

services:
  auth-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      pull: false
    image: ${AUTH_IMAGE_PREFIX:-auth}/auth-web:${AUTH_IMAGE_TAG:-local}
    container_name: auth-web
    # 静态资源 + nginx，几乎不吃内存
    mem_limit: 64m
    mem_reservation: 16m
    environment:
      GATEWAY_HOST: ${GATEWAY_HOST:-auth-gateway}
    ports:
      - "18080:80"
    restart: unless-stopped
    networks:
      - auth-network

networks:
  auth-network:
    external: true
