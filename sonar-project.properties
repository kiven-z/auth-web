sonar.projectKey=auth-web
sonar.projectName=auth-web
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=**/*.test.ts
sonar.sourceEncoding=UTF-8

# 无分析价值：依赖产物 / 生成物 / 静态资源
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.d.ts,mock/**,src/assets/**,**/iconfont/**,src/style/tailwind.css

# 字段声明型样板：只跳过 CPD（对齐后端 Entity/DTO），仍参与规则扫描
sonar.cpd.exclusions=**/*Columns.tsx,**/*Columns.ts,**/columns/**,**/auditColumns.tsx

# 入口 bootstrap() 刻意不用顶层 await，避免生产构建 async 模块初始化死锁（见 vite.config.ts）
sonar.issue.ignore.multicriteria=main-no-top-level-await
sonar.issue.ignore.multicriteria.main-no-top-level-await.ruleKey=typescript:S7785
sonar.issue.ignore.multicriteria.main-no-top-level-await.resourceKey=**/main.ts
